# nginx dentro del contenedor del front. __API__ y __WS__ se cambian al construir la imagen
# (la direccion del backend, ver Dockerfile). escucha en 8080 porque corre sin root
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # los archivos de /assets llevan un hash en el nombre: se pueden guardar un anio
    location /assets/ {
        include /etc/nginx/conf.d/seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # todo lo demas es la app (react router): siempre index.html y sin cache, asi un despliegue nuevo se ve de una
    location / {
        include /etc/nginx/conf.d/seguridad.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
